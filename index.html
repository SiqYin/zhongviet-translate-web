<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<title>漢南辭典</title>
<link rel="icon" href="favicon.ico" sizes="any">
<script>
(function () {
  try {
    var p = localStorage.getItem("hanviet.ui.theme") || "auto";
    var dark = p === "dark" || (p === "auto" && window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brandrow">
    <div class="brand">
      <h1 data-i18n="app.name">漢南辭典</h1>
      <p class="sub" data-i18n="app.sub">漢語 · 越南語 · 字喃</p>
    </div>
    <div class="topright">
      <button id="themeBtn" class="iconbtn" type="button" data-mode="auto" data-i18n-aria="theme.label" aria-label="外观" title="外观">
        <svg class="ic ic-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/>
        </svg>
        <svg class="ic ic-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A8.8 8.8 0 1 1 11.2 3a6.8 6.8 0 0 0 9.8 9.8Z"/>
        </svg>
        <svg class="ic ic-auto" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="7" cy="7" r="2"/>
          <path d="M7 2.4v1.2M7 10.4v1.2M2.4 7h1.2M10.4 7h1.2M3.8 3.8l.9.9M9.3 9.3l.9.9M10.2 3.8l-.9.9M4.7 9.3l-.9.9"/>
          <path d="M21 13.6A8.8 8.8 0 1 1 11.4 4a6.8 6.8 0 0 0 9.6 9.6Z" transform="translate(11,11) scale(0.42)" vector-effect="non-scaling-stroke"/>
          <path d="M4.4 19.6 19.6 4.4"/>
        </svg>
      </button>
      <button id="langBtn" class="langsel" type="button" aria-label="Interface language">繁體中文</button>
      <nav class="tabs" id="tabs" role="tablist">
        <button class="tab on" data-view="dict" role="tab" data-i18n="nav.dict">查詞</button>
        <button class="tab" data-view="ai" role="tab" data-i18n="nav.ai">翻譯</button>
      </nav>
    </div>
  </div>

  <div id="dictBar">
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             data-i18n-ph="search.ph" placeholder="輸入中文詞或越南語">
      <button id="clear" data-i18n-aria="search.clear" aria-label="清除" hidden>×</button>
    </div>
    <div class="hint" id="hint" data-i18n="search.hint">例：雞 ／ 苹果 ／ 电脑 ／ nước ／ gà</div>
  </div>

  <div id="aiBar" hidden>
    <div class="segrow">
      <div class="seg" id="dirSeg">
        <button class="on" data-dir="zh2vi" data-i18n="ai.dir.zh2vi">中 → 越</button>
        <button data-dir="vi2zh" data-i18n="ai.dir.vi2zh">越 → 中</button>
      </div>
      <div class="seg sm" id="scriptSeg">
        <button class="on" data-script="hans" data-i18n="ai.script.hans">簡體</button>
        <button data-script="hant" data-i18n="ai.script.hant">繁體</button>
      </div>
    </div>
    <div class="hint" id="dirHint">简体中文 → 越南语</div>
  </div>
</header>

<main id="main">
  <section id="dictView">
    <section id="histDict" class="hist" hidden></section>
    <section id="results" aria-live="polite"></section>
    <section id="empty" class="empty" hidden>
      <p class="big" data-i18n="empty.title">沒有找到</p>
      <p class="small" data-i18n="empty.sub">可以換個說法，或試試單字。</p>
    </section>
  </section>

  <section id="aiView" hidden>
    <div class="ai-in">
      <textarea id="src" rows="4" spellcheck="false" data-i18n-ph="ai.src.ph.zh2vi" placeholder="在這裡輸入要翻譯的內容…"></textarea>
      <div class="ai-bar">
        <span class="cnt" id="srcCount">0</span>
        <button class="linky" id="sample" data-i18n="ai.sample">範例</button>
        <span class="spacer"></span>
        <button class="ghost" id="clearSrc" data-i18n="ai.clear" hidden>清空</button>
        <button class="primary" id="go" data-i18n="ai.go">翻譯</button>
      </div>
    </div>

    <div id="histAi" class="hist" hidden></div>

    <div id="out" class="ai-out" hidden>
      <div class="out-head">
        <span class="out-label" id="outLabel"></span>
        <span class="out-meta" id="outMeta"></span>
      </div>
      <div class="tokline" id="tokens"></div>
      <div class="out-actions">
        <button class="ghost" id="copy" data-i18n="ai.copy">複製譯文</button>
        <button class="ghost" id="again" data-i18n="ai.again">重新翻譯</button>
      </div>
      <div class="tip" data-i18n="ai.tip">滑鼠移到任一個詞上（手機點一下），可即時查詞典釋義。</div>
    </div>

    <div id="err" class="err" hidden>
      <div class="err-msg" id="errMsg"></div>
      <div class="err-act">
        <button class="ghost" id="offline" data-i18n="ai.err.offline">改用詞庫逐詞直譯</button>
        <button class="ghost" id="toCfg" data-i18n="ai.err.cfg">檢查設定</button>
      </div>
    </div>

    <details class="cfg" id="cfg">
      <summary data-i18n="ai.cfg">翻譯設定</summary>
      <div class="cfg-body">
        <label class="fld"><span data-i18n="ai.cfg.base">服務位址</span>
          <input id="cfgBase" type="text" autocomplete="off" spellcheck="false"></label>
        <label class="fld"><span data-i18n="ai.cfg.model">模型</span>
          <input id="cfgModel" type="text" autocomplete="off" spellcheck="false"></label>
        <label class="fld"><span data-i18n="ai.cfg.key">API Key</span>
          <input id="cfgKey" type="text" autocomplete="off" spellcheck="false"></label>
        <div class="cfg-act">
          <button class="ghost" id="cfgSave" data-i18n="ai.cfg.save">儲存</button>
          <button class="ghost" id="cfgReset" data-i18n="ai.cfg.reset">還原預設</button>
        </div>
        <p class="cfg-note" data-i18n-html="ai.cfg.note"></p>
      </div>
    </details>
  </section>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <button id="close" class="close" data-i18n-aria="search.clear" aria-label="關閉">×</button>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="update-dialog" class="upd" hidden>
  <div class="upd-card" role="dialog" aria-modal="true">
    <div class="upd-title" data-i18n="update.title">发现新版本</div>
    <div class="upd-msg" id="upd-msg"></div>
    <div class="upd-btns">
      <button id="upd-later" class="btn-ghost" data-i18n="update.later">暂不下载</button>
      <button id="upd-go" class="btn-primary" data-i18n="update.download">前往下载</button>
    </div>
  </div>
</div>

<div id="theme-dialog" class="upd" hidden>
  <div class="upd-card" role="dialog" aria-modal="true">
    <div class="upd-title" data-i18n="theme.label">外觀</div>
    <div class="langlist" id="themelist">
      <button type="button" data-theme-opt="light" data-i18n="theme.light">淺色</button>
      <button type="button" data-theme-opt="dark" data-i18n="theme.dark">深色</button>
      <button type="button" data-theme-opt="auto" data-i18n="theme.auto">跟隨系統</button>
    </div>
  </div>
</div>

<div id="lang-dialog" class="upd" hidden>
  <div class="upd-card" role="dialog" aria-modal="true">
    <div class="upd-title" data-i18n="lang.label">界面语言</div>
    <div class="langlist" id="langlist">
      <button type="button" data-lang="hans">简体中文</button>
      <button type="button" data-lang="hant">繁體中文</button>
      <button type="button" data-lang="vi">Tiếng Việt</button>
      <button type="button" data-lang="en">English</button>
    </div>
  </div>
</div>

<div id="pop" class="pop" hidden></div>

<footer class="foot">
  <span id="count"></span>
  <span class="dot">·</span>
  <span>CVDICT · chunom.org</span>
</footer>

<script src="i18n.js?v=4"></script>
<script src="nom.js?v=3"></script>
<script src="zhvi.js?v=3"></script>
<script src="vi2zh.js?v=1"></script>
<script src="app.js?v=4"></script>
<script src="translate.js?v=4"></script>
</body>
</html>
